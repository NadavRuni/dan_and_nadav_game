<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Rectangle</title>
  <style>
    body {
      background: #021d0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 20px;
      color: #00ff80;
      text-shadow: 0 0 10px #00ff80;
    }

    p {
      color: #aaffcc;
      margin-top: 5px;
    }

    canvas {
      margin-top: 20px;
      border: 3px solid #00ff80;
      box-shadow: 0 0 20px rgba(0,255,100,0.6);
      border-radius: 10px;
      cursor: crosshair;
      max-width: 90vw;
      height: auto;
    }

    button {
      margin: 15px;
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #00ff80;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,255,100,0.6);
      transition: all 0.2s;
    }

    button:hover {
      background: #00cc66;
      transform: scale(1.05);
    }

    /* Spinner overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #00ff80;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎱 Confirm Table Rectangle</h1>
  <p>Click 4 corners of the table (top-left → clockwise)</p>

  <canvas id="canvas"></canvas>
  <div>
    <button onclick="submitPoints()">✅ Confirm</button>
    <button onclick="resetCanvas()">🔁 Reset</button>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imagePath = urlParams.get("image");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    const points = [];

    console.log("🟢 confirm_rectangle.html loaded. Image:", imagePath);

    img.onload = () => {
      console.log("🖼 Image loaded:", img.width, "x", img.height);

      // ✅ הגבלת גודל עם שמירה על יחס
      const MAX_WIDTH = 900;
      const scale = Math.min(1, MAX_WIDTH / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      console.log(`📐 Applied scale = ${scale.toFixed(2)} (canvas: ${canvas.width}x${canvas.height})`);
    };

    img.src = "/" + imagePath;

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      points.push({ x, y });
      drawPoints();
    });

    function drawPoints() {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "red";
      ctx.lineWidth = 3;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
      }
      if (points.length === 4) {
        ctx.strokeStyle = "#00ff80";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.closePath();
        ctx.stroke();
      }
    }

    function resetCanvas() {
      points.length = 0;
      drawPoints();
    }

    function showLoading(show) {
      const overlay = document.getElementById("loading");
      if (show) overlay.classList.add("active");
      else overlay.classList.remove("active");
    }

    async function submitPoints() {
      if (points.length !== 4) {
        alert("Please select exactly 4 points!");
        return;
      }

      showLoading(true);
      try {
        console.log("📤 Sending points:", points);
        const res = await fetch("/api/confirm_rectangle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_path: imagePath, points })
        });

        if (!res.ok) throw new Error("Failed to confirm rectangle");

        alert("✅ Rectangle confirmed! Running full pipeline...");
        window.location.href = "/frontend/analysis.html";
      } catch (err) {
        alert("❌ Error: " + err.message);
        console.error(err);
      } finally {
        showLoading(false);
      }
    }
  </script>
</body>
</html>
