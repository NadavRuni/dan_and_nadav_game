<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Billiard Pipeline</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #043d16, #021d0b);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      background: rgba(20, 50, 20, 0.75);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,255,100,0.3);
      max-width: 550px;
      width: 90%;
      text-align: center;
      border: 2px solid rgba(0,255,100,0.5);
      z-index: 2;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2.5em;
      color: #00ff80;
      text-shadow: 0 0 10px #00ff80, 0 0 20px #00ff40;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00ff80, 0 0 10px #00ff40; }
      to   { text-shadow: 0 0 20px #00ff80, 0 0 40px #00ff40; }
    }

    .file-btn, .camera-btn {
      display: inline-block;
      background: radial-gradient(circle at center, #00ff80, #008040);
      color: #000;
      font-weight: bold;
      padding: 14px 30px;
      font-size: 1.2em;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,100,0.6);
      margin: 10px;
      transition: transform 0.2s ease-in-out, box-shadow 0.3s;
    }

    .file-btn:hover, .camera-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(0,255,180,0.9);
    }

    input[type="file"] {
      display: none;
    }

    .ball-preview {
      margin-top: 20px;
    }

    .ball-preview img {
      max-width: 120px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(0,255,100,0.8);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #00ff80;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎱 Billiard Pipeline 🎱</h1>

    <label for="fileInput" class="file-btn">📂 Choose from Gallery</label>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">

    <label for="cameraInput" class="camera-btn">📸 Take a Photo</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFile(this.files[0])">

    <div class="ball-preview" id="preview"></div>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    let hasNavigated = false;
    let watcher = null;

    console.log("🚀 Billiard Pipeline page loaded.");

    // --- Spinner ---
    function showLoading(show) {
      const overlay = document.getElementById("loading");
      if (show) overlay.classList.add("active");
      else overlay.classList.remove("active");
    }

    // --- Preview image ---
    function previewFile(file) {
      const preview = document.getElementById("preview");
      preview.innerHTML = "";
      if (file) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
        console.log("🖼 Preview displayed:", file.name);
      }
    }

    // --- Upload file ---
    async function handleFile(file) {
      try {
        console.log("📤 Upload triggered:", file);
        if (!file) return;

        previewFile(file);
        showLoading(true);

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch("/api/run_pipeline", {
          method: "POST",
          body: formData,
        });

        console.log("📩 Response:", res.status);
        if (!res.ok) throw new Error("Upload failed: " + res.status);

        const data = await res.json();
        console.log("✅ Pipeline result:", data);

        if (data.redirect_url) {
          hasNavigated = true;
          if (watcher) watcher.postMessage("stop");
          console.log("🌐 Redirect:", data.redirect_url);
          window.location.href = data.redirect_url;
        }
      } catch (err) {
        console.error("❌ Upload error:", err);
        alert("❌ " + err.message);
      } finally {
        showLoading(false);
      }
    }

    // --- Start worker watcher ---
    function startWatcher() {
      if (window.Worker) {
        watcher = new Worker("/frontend/nav_watcher.js");
        watcher.onmessage = (e) => {
          if (e.data.type === "navigate" && !hasNavigated) {
            console.log("🚀 Redirect (from worker):", e.data.url);
            hasNavigated = true;
            watcher.postMessage("stop");
            window.location.href = e.data.url;
          }
        };
        watcher.postMessage("start");
        console.log("✅ Background watcher started.");
      } else {
        console.warn("⚠️ Web Workers not supported. Using fallback polling.");
        setInterval(pollFallback, 1000);
      }
    }

    // fallback רגיל אם אין worker
    async function pollFallback() {
      if (hasNavigated) return;
      const res = await fetch("/frontend_nav.json?ts=" + Date.now(), { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (data.navigate_to) {
          console.log("🚀 Redirect (fallback):", data.navigate_to);
          hasNavigated = true;
          window.location.href = data.navigate_to;
        }
      }
    }

    window.addEventListener("load", startWatcher);
  </script>
</body>
</html>
